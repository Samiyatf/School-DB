<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College AMS Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h2>College AMS</h2>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="manager.html?entity=colleges" class="teacher-only">Colleges</a>
        <a href="manager.html?entity=departments" class="teacher-only">Departments</a>
        <a href="manager.html?entity=students">Students</a>
        <a href="manager.html?entity=student_accounts" class="teacher-only">Student Accounts</a>
        <a href="manager.html?entity=instructors" class="teacher-only">Instructors</a>
        <a href="manager.html?entity=instructor_profiles" class="teacher-only">Instructor Profiles</a>
        <a href="manager.html?entity=courses">Courses</a>
        <a href="manager.html?entity=classrooms" class="teacher-only">Classrooms</a>
        <a href="manager.html?entity=sections">Sections</a>
        <a href="manager.html?entity=enrollments">Enrollments</a>
      </nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1 id="pageTitle">Manager</h1>
        <div class="header-actions">
          <button id="addRecordBtn">Add Record</button>
          <button id="exportBtn">Export This Table JSON</button>
          <a href="index.html" class="home-link">Return Home</a>
        </div>
      </header>

      <section class="controls">
        <input type="text" id="searchInput" placeholder="Search..." />
      </section>

      <section class="table-section">
        <table id="recordsTable">
          <thead id="tableHead"></thead>
          <tbody></tbody>
        </table>
        <div id="emptyMessage" style="display:none;">No records found.</div>
      </section>

      <div id="recordModal" class="modal">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <h2 id="modalTitle">Add Record</h2>
          <form id="recordForm"></form>
        </div>
      </div>
    </main>
  </div>

  <script src="manager.js"></script>
</body>
</html>
