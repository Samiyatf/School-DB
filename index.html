<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Records Database</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Secure Records Database</h1>
  </header>
  <main>
    <section class="controls">
      <input type="text" id="searchInput" placeholder="Search records..." />
      <button id="addRecordBtn">Add Record</button>
      <button id="exportBtn">Export JSON</button>
    </section>
    <section class="table-section">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data goes here -->
        </tbody>
      </table>
      <div id="emptyMessage" style="display:none;">No records found.</div>
    </section>
    <!-- Modal for Add/Edit -->
    <div id="recordModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2 id="modalTitle">Add Record</h2>
        <form id="recordForm">
          <label>
            Name:
            <input type="text" name="name" required />
          </label>
          <label>
            Email:
            <input type="email" name="email" required />
          </label>
          <label>
            Role:
            <select name="role" required>
              <option value="">Select a role</option>
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Administrator">Administrator</option>
            </select>
          </label>
          <input type="hidden" name="id" />
          <div class="modal-actions">
            <button type="submit" id="saveBtn">Save</button>
            <button type="button" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <!-- End Modal -->
  </main>
  <footer>
    <div>© 2026 Secure Database UI</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
